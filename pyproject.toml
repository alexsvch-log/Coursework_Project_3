[project]
name = "coursework-project-3"
version = "0.1.0"
description = ""
authors = [
    {name = "alex_svch_777",email = "logger_77@mail.ru"}
]
requires-python = "^3.14"
dependencies = [
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
lint = [
    "black (>=26.5.1,<27.0.0)",
    "flake8 (>=7.3.0,<8.0.0)",
    "mypy (>=2.3.1,<3.0.0)",
    "isort (>=8.0.1,<9.0.0)",
    "flake8-pyproject (>=1.2.4,<2.0.0)"
]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "pytest-mock (>=3.15.1,<4.0.0)"
]


[tool.flake8]
# Игнорировать ошибки (совместимость с Black)
extend-ignore = ["E203", "W503", "D203"]
# Максимальная длина строки
max-line-length = 119
# Исключить директории
exclude = [".git", "__pycache__", "venv", ".venv", "logs", "htmlcov", ".env", ".env.example"]
# Игнорировать правила для конкретных файлов
per-file-ignores = [
    "__init__.py:F401",
    "tests/*:S101",
    "helper.py:F401",
]

[tool.black]
line-length = 119
exclude = ".git"

[tool.isort]
profile = "black"
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
line_length = 119

[tool.mypy]
python_version = "3.14"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
exclude = ['venv', 'helper.py']  # Исключение папок

[tool.pytest.ini_options]
# Указываем, в какой папке искать тесты (чтобы pytest сразу шел в tests)
testpaths = ["tests"]

# Передаем флаги игнорирования конкретных файлов через addopts
addopts = [
    "--ignore=src/main.py",
    "--ignore=src/helper.py"
]


